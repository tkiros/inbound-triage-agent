[project]
name = "inbound-triage-agent"
version = "0.1.0"
description = "Inbound email triage: classification, authorized tool calls, risk gate and human approval"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.9",
    "fastapi>=0.115",
    "langgraph==1.2.22",
    "langgraph-checkpoint-postgres==3.2.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "slack-bolt==1.30.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
